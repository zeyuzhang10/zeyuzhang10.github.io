<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}Zeyu Zhang</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | escape }}">
  <meta name="theme-color" content="#faf9f7">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/images/favicon-lightning-clean.png' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Allura&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous">
  <link rel="stylesheet" href="{{ '/assets/css/font_sans_serif.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme-luka.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>
<body class="theme-luka blog-page">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <nav class="top-nav" aria-label="Primary navigation">
    <div class="nav-container">
      <a class="nav-brand" href="{{ '/index.html#top' | relative_url }}" aria-label="Zeyu Zhang — home">Zeyu Zhang</a>
      <div class="nav-actions">
        <div class="nav-links" aria-label="Page sections">
          <a href="{{ '/index.html#about' | relative_url }}">About</a>
          <a href="{{ '/index.html#publications' | relative_url }}">Publications</a>
          <a href="{{ '/index.html#activities' | relative_url }}">Activities</a>
          <a class="active" href="{{ '/blog.html' | relative_url }}" aria-current="page">Blog</a>
        </div>
        <button id="themeToggle" class="theme-toggle" type="button" title="Switch color theme" aria-label="Switch color theme">
          <span class="theme-icon" aria-hidden="true">☾</span>
        </button>
      </div>
    </div>
  </nav>

  <main class="blog-main" id="main-content">
    {{ content }}
  </main>

  <footer class="blog-footer">&copy; 2026 Zeyu Zhang. All rights reserved.</footer>
  <script src="{{ '/assets/js/blog.js' | relative_url }}"></script>
</body>
</html>
